<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qubic-Würfel – verdreht löst sich selbst</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 30%, #1c2340 0%, #0b0e1a 55%, #05060c 100%);
    font-family: sans-serif;
  }

  .scene {
    perspective: 1100px;
  }

  /* Auf- und abschweben */
  .float {
    transform-style: preserve-3d;
    animation: float 6s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(-18px); }
    50%      { transform: translateY(18px); }
  }

  /* Taumelnde Drehung um alle drei Achsen (X: 1, Y: 2, Z: 1 Umdrehung pro Zyklus) */
  .cube {
    position: relative;
    width: 300px;
    height: 300px;
    transform-style: preserve-3d;
    animation: tumble 60s linear infinite;
  }

  @keyframes tumble {
    from { transform: rotateX(-20deg) rotateY(0deg)   rotateZ(0deg); }
    to   { transform: rotateX(340deg) rotateY(720deg) rotateZ(360deg); }
  }

  .face {
    position: absolute;
    inset: 3px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    padding: 6px;
    background: #0a0a0a;
    border-radius: 14px;
    backface-visibility: hidden;
  }

  .sticker {
    border-radius: 12px;
    box-shadow:
      inset 0 2px 6px rgba(255, 255, 255, 0.35),
      inset 0 -3px 8px rgba(0, 0, 0, 0.35);
  }

  .front  { transform: translateZ(150px); }
  .back   { transform: rotateY(180deg) translateZ(150px); }
  .right  { transform: rotateY(90deg)  translateZ(150px); }
  .left   { transform: rotateY(-90deg) translateZ(150px); }
  .top    { transform: rotateX(90deg)  translateZ(150px); }
  .bottom { transform: rotateX(-90deg) translateZ(150px); }

  /* Bodenschatten, atmet mit dem Schweben */
  .shadow {
    position: absolute;
    bottom: -170px;
    left: 50%;
    width: 280px;
    height: 46px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(0, 0, 0, 0.55) 0%, transparent 70%);
    filter: blur(6px);
    animation: shadowPulse 6s ease-in-out infinite;
  }

  @keyframes shadowPulse {
    0%, 100% { transform: translateX(-50%) scale(1.05); opacity: 0.9; }
    50%      { transform: translateX(-50%) scale(0.8);  opacity: 0.55; }
  }

  .title {
    position: fixed;
    bottom: 34px;
    width: 100%;
    text-align: center;
    color: #8b93b0;
    letter-spacing: 6px;
    font-size: 13px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

  <div class="scene">
    <div class="float">
      <div class="cube">
        <div class="face front"  data-face="front"></div>
        <div class="face back"   data-face="back"></div>
        <div class="face right"  data-face="right"></div>
        <div class="face left"   data-face="left"></div>
        <div class="face top"    data-face="top"></div>
        <div class="face bottom" data-face="bottom"></div>
      </div>
    </div>
    <div class="shadow"></div>
  </div>

  <div class="title">Qubic &middot; Scramble &rarr; Solved</div>

<script>
  /* 27 Cubies mit je 9 Stickern pro Seite erzeugen */
  const faces = Array.from(document.querySelectorAll('.face'));
  faces.forEach(face => {
    for (let i = 0; i < 9; i++) {
      const sticker = document.createElement('div');
      sticker.className = 'sticker';
      face.appendChild(sticker);
    }
  });

  const stickers = Array.from(document.querySelectorAll('.sticker'));

  /* Farbpalette: [Verlauf oben, Verlauf unten] als RGB */
  const COLORS = {
    white:  [[255, 255, 255], [207, 214, 223]],
    yellow: [[255, 217, 59],  [224, 168, 0]],
    red:    [[255, 77, 79],   [192, 16, 72]],
    orange: [[255, 159, 67],  [224, 107, 0]],
    blue:   [[77, 163, 255],  [11, 87, 194]],
    green:  [[76, 224, 127],  [15, 157, 74]]
  };
  const NAMES = Object.keys(COLORS);
  const FACE_COLOR = {
    front: 'white', back: 'yellow',
    right: 'red',   left: 'orange',
    top: 'blue',    bottom: 'green'
  };

  const lerp = (a, b, t) => a + (b - a) * t;
  const lerpColor = (c1, c2, t) => [0, 1, 2].map(k => Math.round(lerp(c1[k], c2[k], t)));
  const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  let current = [];

  function applyBg(i) {
    const [c1, c2] = current[i];
    stickers[i].style.background =
      `linear-gradient(145deg, rgb(${c1}), rgb(${c2}))`;
  }

  function applyAll() {
    for (let i = 0; i < stickers.length; i++) applyBg(i);
  }

  /* Echte Verdrehung: 54 Sticker, je 9 pro Farbe, gemischt */
  function randomScramble() {
    const bag = [];
    NAMES.forEach(name => {
      for (let k = 0; k < 9; k++) bag.push(name);
    });
    for (let i = bag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [bag[i], bag[j]] = [bag[j], bag[i]];
    }
    return bag.map(name => COLORS[name]);
  }

  /* Zielfarben: jede Fläche einfarbig */
  function solvedTargets() {
    return stickers.map(st =>
      COLORS[FACE_COLOR[st.closest('.face').dataset.face]]
    );
  }

  /* Alle Sticker faerben sich zu ihren Zielfarben, leicht gestaffelt */
  function tweenAll(targets, duration, staggerMax, done) {
    const starts = current.map(c => [c[0].slice(), c[1].slice()]);
    const delays = stickers.map(() => Math.random() * staggerMax);
    const t0 = performance.now();

    (function frame(now) {
      let allDone = true;
      stickers.forEach((st, i) => {
        const t = Math.min(Math.max((now - t0 - delays[i]) / duration, 0), 1);
        if (t < 1) allDone = false;
        const e = easeInOut(t);
        current[i] = [
          lerpColor(starts[i][0], targets[i][0], e),
          lerpColor(starts[i][1], targets[i][1], e)
        ];
        applyBg(i);
      });
      if (!allDone) requestAnimationFrame(frame);
      else if (done) done();
    })(performance.now());
  }

  /* Zyklus: verdreht -> loest sich -> loest gehalten -> verdreht neu */
  current = randomScramble();
  applyAll();

  (function cycle() {
    setTimeout(() => {
      tweenAll(solvedTargets(), 9000, 2500, () => {
        setTimeout(() => {
          tweenAll(randomScramble(), 1500, 600, () => {
            setTimeout(cycle, 3000);
          });
        }, 5000);
      });
    }, 3000);
  })();
</script>

</body>
</html>
