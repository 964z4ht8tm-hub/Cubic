<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cubic-Würfel – frei schwebend</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 30%, #1c2340 0%, #0b0e1a 55%, #05060c 100%);
    font-family: sans-serif;
  }

  .scene {
    perspective: 1100px;
  }

  /* Auf- und abschweben */
  .float {
    transform-style: preserve-3d;
    animation: float 6s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(-18px); }
    50%      { transform: translateY(18px); }
  }

  /* Taumelnde Drehung um alle drei Achsen (X: 1, Y: 2, Z: 1 Umdrehung pro Zyklus) */
  .cube {
    position: relative;
    width: 300px;
    height: 300px;
    transform-style: preserve-3d;
    animation: tumble 60s linear infinite;
  }

  @keyframes tumble {
    from { transform: rotateX(-20deg) rotateY(0deg)   rotateZ(0deg); }
    to   { transform: rotateX(340deg) rotateY(720deg) rotateZ(360deg); }
  }

  .face {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 12px;
    background: #0a0a0a;
    border-radius: 14px;
    backface-visibility: hidden;
  }

  .sticker {
    border-radius: 12px;
    box-shadow:
      inset 0 2px 6px rgba(255, 255, 255, 0.35),
      inset 0 -3px 8px rgba(0, 0, 0, 0.35);
  }

  .white  { background: linear-gradient(145deg, #ffffff, #cfd6df); }
  .yellow { background: linear-gradient(145deg, #ffd93b, #e0a800); }
  .red    { background: linear-gradient(145deg, #ff4d4f, #c01048); }
  .orange { background: linear-gradient(145deg, #ff9f43, #e06b00); }
  .blue   { background: linear-gradient(145deg, #4da3ff, #0b57c2); }
  .green  { background: linear-gradient(145deg, #4ce07f, #0f9d4a); }

  /* Schubladen: jede Fläche gleitet zu einem eigenen Zeitpunkt heraus.
     Unterschiedliche Zykluslängen verschieben die Phasen gegeneinander,
     sodass die Oeffnungen unregelmäßig wirken. */

  .front {
    transform: translateZ(150px);
    animation: drawer-front 26s ease-in-out -3s infinite;
  }

  @keyframes drawer-front {
    0%, 44%  { transform: translateZ(150px);
               box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9); }
    48%, 54% { transform: translateZ(198px);
               box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9),
                           0 0 26px rgba(120, 170, 255, 0.3); }
    58%, 100% { transform: translateZ(150px);
               box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9); }
  }

  .back {
    transform: rotateY(180deg) translateZ(150px);
    animation: drawer-back 31s ease-in-out -11s infinite;
  }

  @keyframes drawer-back {
    0%, 44%  { transform: rotateY(180deg) translateZ(150px);
               box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9); }
    48%, 54% { transform: rotateY(180deg) translateZ(198px);
               box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9),
                           0 0 26px rgba(120, 170, 255, 0.3); }
    58%, 100% { transform: rotateY(180deg) translateZ(150px);
               box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9); }
  }

  .right {
    transform: rotateY(90deg) translateZ(150px);
    animation: drawer-right 24s ease-in-out -7s infinite;
  }

  @keyframes drawer-right {
    0%, 44%  { transform: rotateY(90deg) translateZ(150px);
               box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9); }
    48%, 54% { transform: rotateY(90deg) translateZ(198px);
               box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9),
                           0 0 26px rgba(120, 170, 255, 0.3); }
    58%, 100% { transform: rotateY(90deg) translateZ(150px);
               box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9); }
  }

  .left {
    transform: rotateY(-90deg) translateZ(150px);
    animation: drawer-left 34s ease-in-out -19s infinite;
  }

  @keyframes drawer-left {
    0%, 44%  { transform: rotateY(-90deg) translateZ(150px);
               box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9); }
    48%, 54% { transform: rotateY(-90deg) translateZ(198px);
               box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9),
                           0 0 26px rgba(120, 170, 255, 0.3); }
    58%, 100% { transform: rotateY(-90deg) translateZ(150px);
               box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9); }
  }

  .top {
    transform: rotateX(90deg) translateZ(150px);
    animation: drawer-top 28s ease-in-out -15s infinite;
  }

  @keyframes drawer-top {
    0%, 44%  { transform: rotateX(90deg) translateZ(150px);
               box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9); }
    48%, 54% { transform: rotateX(90deg) translateZ(198px);
               box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9),
                           0 0 26px rgba(120, 170, 255, 0.3); }
    58%, 100% { transform: rotateX(90deg) translateZ(150px);
               box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9); }
  }

  .bottom {
    transform: rotateX(-90deg) translateZ(150px);
    animation: drawer-bottom 37s ease-in-out -5s infinite;
  }

  @keyframes drawer-bottom {
    0%, 44%  { transform: rotateX(-90deg) translateZ(150px);
               box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9); }
    48%, 54% { transform: rotateX(-90deg) translateZ(198px);
               box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9),
                           0 0 26px rgba(120, 170, 255, 0.3); }
    58%, 100% { transform: rotateX(-90deg) translateZ(150px);
               box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9); }
  }

  /* Bodenschatten, atmet mit dem Schweben */
  .shadow {
    position: absolute;
    bottom: -170px;
    left: 50%;
    width: 280px;
    height: 46px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(0, 0, 0, 0.55) 0%, transparent 70%);
    filter: blur(6px);
    animation: shadowPulse 6s ease-in-out infinite;
  }

  @keyframes shadowPulse {
    0%, 100% { transform: translateX(-50%) scale(1.05); opacity: 0.9; }
    50%      { transform: translateX(-50%) scale(0.8);  opacity: 0.55; }
  }

  .title {
    position: fixed;
    bottom: 34px;
    width: 100%;
    text-align: center;
    color: #8b93b0;
    letter-spacing: 6px;
    font-size: 13px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

  <div class="scene">
    <div class="float">
      <div class="cube">
        <div class="face front">
          <div class="sticker white"></div><div class="sticker white"></div><div class="sticker white"></div>
          <div class="sticker white"></div><div class="sticker white"></div><div class="sticker white"></div>
          <div class="sticker white"></div><div class="sticker white"></div><div class="sticker white"></div>
        </div>
        <div class="face back">
          <div class="sticker yellow"></div><div class="sticker yellow"></div><div class="sticker yellow"></div>
          <div class="sticker yellow"></div><div class="sticker yellow"></div><div class="sticker yellow"></div>
          <div class="sticker yellow"></div><div class="sticker yellow"></div><div class="sticker yellow"></div>
        </div>
        <div class="face right">
          <div class="sticker red"></div><div class="sticker red"></div><div class="sticker red"></div>
          <div class="sticker red"></div><div class="sticker red"></div><div class="sticker red"></div>
          <div class="sticker red"></div><div class="sticker red"></div><div class="sticker red"></div>
        </div>
        <div class="face left">
          <div class="sticker orange"></div><div class="sticker orange"></div><div class="sticker orange"></div>
          <div class="sticker orange"></div><div class="sticker orange"></div><div class="sticker orange"></div>
          <div class="sticker orange"></div><div class="sticker orange"></div><div class="sticker orange"></div>
        </div>
        <div class="face top">
          <div class="sticker blue"></div><div class="sticker blue"></div><div class="sticker blue"></div>
          <div class="sticker blue"></div><div class="sticker blue"></div><div class="sticker blue"></div>
          <div class="sticker blue"></div><div class="sticker blue"></div><div class="sticker blue"></div>
        </div>
        <div class="face bottom">
          <div class="sticker green"></div><div class="sticker green"></div><div class="sticker green"></div>
          <div class="sticker green"></div><div class="sticker green"></div><div class="sticker green"></div>
          <div class="sticker green"></div><div class="sticker green"></div><div class="sticker green"></div>
        </div>
      </div>
    </div>
    <div class="shadow"></div>
  </div>

  <div class="title">Cubic &middot; Floating</div>

</body>
</html>
