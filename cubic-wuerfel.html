<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cubic-Würfel – frei schwebend</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 30%, #1c2340 0%, #0b0e1a 55%, #05060c 100%);
    font-family: sans-serif;
  }

  .scene {
    perspective: 1100px;
  }

  /* Auf- und abschweben */
  .float {
    animation: float 6s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(-18px); }
    50%      { transform: translateY(18px); }
  }

  .cube {
    position: relative;
    width: 300px;
    height: 300px;
    transform-style: preserve-3d;
    transform: rotateX(-22deg) rotateY(0deg) rotateZ(0deg);
    will-change: transform;
  }

  .face {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 12px;
    background: #0a0a0a;
    border-radius: 14px;
    box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9);
    transition: transform 1.1s cubic-bezier(0.45, 0, 0.25, 1);
    will-change: transform;
  }

  .face.open {
    box-shadow:
      inset 0 0 30px rgba(0, 0, 0, 0.9),
      0 0 26px rgba(120, 170, 255, 0.28);
  }

  .sticker {
    border-radius: 12px;
    box-shadow:
      inset 0 2px 6px rgba(255, 255, 255, 0.35),
      inset 0 -3px 8px rgba(0, 0, 0, 0.35);
  }

  .white  { background: linear-gradient(145deg, #ffffff, #cfd6df); }
  .yellow { background: linear-gradient(145deg, #ffd93b, #e0a800); }
  .red    { background: linear-gradient(145deg, #ff4d4f, #c01048); }
  .orange { background: linear-gradient(145deg, #ff9f43, #e06b00); }
  .blue   { background: linear-gradient(145deg, #4da3ff, #0b57c2); }
  .green  { background: linear-gradient(145deg, #4ce07f, #0f9d4a); }

  .front  { transform: translateZ(150px); }
  .back   { transform: rotateY(180deg) translateZ(150px); }
  .right  { transform: rotateY(90deg)  translateZ(150px); }
  .left   { transform: rotateY(-90deg) translateZ(150px); }
  .top    { transform: rotateX(90deg)  translateZ(150px); }
  .bottom { transform: rotateX(-90deg) translateZ(150px); }

  /* Bodenschatten, atmet mit dem Schweben */
  .shadow {
    position: absolute;
    bottom: -170px;
    left: 50%;
    width: 280px;
    height: 46px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(0, 0, 0, 0.55) 0%, transparent 70%);
    filter: blur(6px);
    animation: shadowPulse 6s ease-in-out infinite;
  }

  @keyframes shadowPulse {
    0%, 100% { transform: translateX(-50%) scale(1.05); opacity: 0.9; }
    50%      { transform: translateX(-50%) scale(0.8);  opacity: 0.55; }
  }

  .title {
    position: fixed;
    bottom: 34px;
    width: 100%;
    text-align: center;
    color: #8b93b0;
    letter-spacing: 6px;
    font-size: 13px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

  <div class="scene">
    <div class="float">
      <div class="cube" id="cube">
        <div class="face front" data-face="front">
          <div class="sticker white"></div><div class="sticker white"></div><div class="sticker white"></div>
          <div class="sticker white"></div><div class="sticker white"></div><div class="sticker white"></div>
          <div class="sticker white"></div><div class="sticker white"></div><div class="sticker white"></div>
        </div>
        <div class="face back" data-face="back">
          <div class="sticker yellow"></div><div class="sticker yellow"></div><div class="sticker yellow"></div>
          <div class="sticker yellow"></div><div class="sticker yellow"></div><div class="sticker yellow"></div>
          <div class="sticker yellow"></div><div class="sticker yellow"></div><div class="sticker yellow"></div>
        </div>
        <div class="face right" data-face="right">
          <div class="sticker red"></div><div class="sticker red"></div><div class="sticker red"></div>
          <div class="sticker red"></div><div class="sticker red"></div><div class="sticker red"></div>
          <div class="sticker red"></div><div class="sticker red"></div><div class="sticker red"></div>
        </div>
        <div class="face left" data-face="left">
          <div class="sticker orange"></div><div class="sticker orange"></div><div class="sticker orange"></div>
          <div class="sticker orange"></div><div class="sticker orange"></div><div class="sticker orange"></div>
          <div class="sticker orange"></div><div class="sticker orange"></div><div class="sticker orange"></div>
        </div>
        <div class="face top" data-face="top">
          <div class="sticker blue"></div><div class="sticker blue"></div><div class="sticker blue"></div>
          <div class="sticker blue"></div><div class="sticker blue"></div><div class="sticker blue"></div>
          <div class="sticker blue"></div><div class="sticker blue"></div><div class="sticker blue"></div>
        </div>
        <div class="face bottom" data-face="bottom">
          <div class="sticker green"></div><div class="sticker green"></div><div class="sticker green"></div>
          <div class="sticker green"></div><div class="sticker green"></div><div class="sticker green"></div>
          <div class="sticker green"></div><div class="sticker green"></div><div class="sticker green"></div>
        </div>
      </div>
    </div>
    <div class="shadow"></div>
  </div>

  <div class="title">Cubic &middot; Floating</div>

<script>
  const cube = document.getElementById('cube');

  /* Tumble-Rotation um alle drei Achsen */
  let rx = -22, ry = 0, rz = 0;
  const speedX = 0.08, speedY = 0.18, speedZ = 0.05;

  (function tumble() {
    rx += speedX;
    ry += speedY;
    rz += speedZ;
    cube.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg)`;
    requestAnimationFrame(tumble);
  })();

  /* Zufälliges Oeffnen einer Fläche wie eine Schublade */
  const baseTransforms = {
    front:  'translateZ(150px)',
    back:   'rotateY(180deg) translateZ(150px)',
    right:  'rotateY(90deg)  translateZ(150px)',
    left:   'rotateY(-90deg) translateZ(150px)',
    top:    'rotateX(90deg)  translateZ(150px)',
    bottom: 'rotateX(-90deg) translateZ(150px)'
  };
  const DRAWER_OUT = 45;
  const faces = Array.from(document.querySelectorAll('.face'));

  function openRandomDrawer() {
    const face = faces[Math.floor(Math.random() * faces.length)];
    const name = face.dataset.face;
    const out = baseTransforms[name].replace(
      /translateZ\((\d+)px\)/,
      (_, z) => `translateZ(${Number(z) + DRAWER_OUT}px)`
    );

    face.style.transform = out;
    face.classList.add('open');

    setTimeout(() => {
      face.style.transform = baseTransforms[name];
      face.classList.remove('open');
    }, 1600);

    setTimeout(openRandomDrawer, 4000 + Math.random() * 5000);
  }

  setTimeout(openRandomDrawer, 2500);
</script>

</body>
</html>
