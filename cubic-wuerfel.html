<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cubic-Würfel – frei schwebend</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 30%, #1c2340 0%, #0b0e1a 55%, #05060c 100%);
    font-family: sans-serif;
  }

  .scene {
    perspective: 1100px;
  }

  /* Auf- und abschweben */
  .float {
    transform-style: preserve-3d;
    animation: float 6s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(-18px); }
    50%      { transform: translateY(18px); }
  }

  /* Taumelnde Drehung um alle drei Achsen (X: 1, Y: 2, Z: 1 Umdrehung pro Zyklus) */
  .cube {
    position: relative;
    width: 300px;
    height: 300px;
    transform-style: preserve-3d;
    animation: tumble 60s linear infinite;
  }

  @keyframes tumble {
    from { transform: rotateX(-20deg) rotateY(0deg)   rotateZ(0deg); }
    to   { transform: rotateX(340deg) rotateY(720deg) rotateZ(360deg); }
  }

  .face {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 12px;
    background: #0a0a0a;
    border-radius: 14px;
    transform-style: preserve-3d;
    backface-visibility: hidden;
  }

  .sticker {
    border-radius: 12px;
    transform: translateZ(0);
    box-shadow:
      inset 0 2px 6px rgba(255, 255, 255, 0.35),
      inset 0 -3px 8px rgba(0, 0, 0, 0.35);
    animation: sticker-out 25s ease-in-out infinite;
  }

  .white  { background: linear-gradient(145deg, #ffffff, #cfd6df); }
  .yellow { background: linear-gradient(145deg, #ffd93b, #e0a800); }
  .red    { background: linear-gradient(145deg, #ff4d4f, #c01048); }
  .orange { background: linear-gradient(145deg, #ff9f43, #e06b00); }
  .blue   { background: linear-gradient(145deg, #4da3ff, #0b57c2); }
  .green  { background: linear-gradient(145deg, #4ce07f, #0f9d4a); }

  .front  { transform: translateZ(150px); }
  .back   { transform: rotateY(180deg) translateZ(150px); }
  .right  { transform: rotateY(90deg)  translateZ(150px); }
  .left   { transform: rotateY(-90deg) translateZ(150px); }
  .top    { transform: rotateX(90deg)  translateZ(150px); }
  .bottom { transform: rotateX(-90deg) translateZ(150px); }

  /* Schubladen: ein zufällig wirkender Sticker gleitet heraus und zurück.
     Alle 54 Sticker teilen sich eine Keyframe-Definition, erhalten aber
     eigene Zykluslängen und Phasenverschiebungen - dadurch öffnen sich
     unterschiedliche Sticker zu unregelmäßigen Zeitpunkten. */

  @keyframes sticker-out {
    0%, 42%    { transform: translateZ(0);
                 box-shadow:
                   inset 0 2px 6px rgba(255, 255, 255, 0.35),
                   inset 0 -3px 8px rgba(0, 0, 0, 0.35); }
    46%, 54%   { transform: translateZ(48px);
                 box-shadow:
                   inset 0 2px 6px rgba(255, 255, 255, 0.35),
                   inset 0 -3px 8px rgba(0, 0, 0, 0.35),
                   0 0 22px rgba(120, 170, 255, 0.45); }
    58%, 100%  { transform: translateZ(0);
                 box-shadow:
                   inset 0 2px 6px rgba(255, 255, 255, 0.35),
                   inset 0 -3px 8px rgba(0, 0, 0, 0.35); }
  }

  .front .sticker:nth-child(1) { animation-duration: 25s; animation-delay: -15s; }
  .front .sticker:nth-child(2) { animation-duration: 32s; animation-delay: -28s; }
  .front .sticker:nth-child(3) { animation-duration: 39s; animation-delay: -41s; }
  .front .sticker:nth-child(4) { animation-duration: 21s; animation-delay: -13s; }
  .front .sticker:nth-child(5) { animation-duration: 28s; animation-delay: -26s; }
  .front .sticker:nth-child(6) { animation-duration: 35s; animation-delay: -39s; }
  .front .sticker:nth-child(7) { animation-duration: 42s; animation-delay: -11s; }
  .front .sticker:nth-child(8) { animation-duration: 24s; animation-delay: -24s; }
  .front .sticker:nth-child(9) { animation-duration: 31s; animation-delay: -37s; }
  .back .sticker:nth-child(1) { animation-duration: 38s; animation-delay: -9s; }
  .back .sticker:nth-child(2) { animation-duration: 20s; animation-delay: -22s; }
  .back .sticker:nth-child(3) { animation-duration: 27s; animation-delay: -35s; }
  .back .sticker:nth-child(4) { animation-duration: 34s; animation-delay: -7s; }
  .back .sticker:nth-child(5) { animation-duration: 41s; animation-delay: -20s; }
  .back .sticker:nth-child(6) { animation-duration: 23s; animation-delay: -33s; }
  .back .sticker:nth-child(7) { animation-duration: 30s; animation-delay: -5s; }
  .back .sticker:nth-child(8) { animation-duration: 37s; animation-delay: -18s; }
  .back .sticker:nth-child(9) { animation-duration: 19s; animation-delay: -31s; }
  .right .sticker:nth-child(1) { animation-duration: 26s; animation-delay: -3s; }
  .right .sticker:nth-child(2) { animation-duration: 33s; animation-delay: -16s; }
  .right .sticker:nth-child(3) { animation-duration: 40s; animation-delay: -29s; }
  .right .sticker:nth-child(4) { animation-duration: 22s; animation-delay: -42s; }
  .right .sticker:nth-child(5) { animation-duration: 29s; animation-delay: -14s; }
  .right .sticker:nth-child(6) { animation-duration: 36s; animation-delay: -27s; }
  .right .sticker:nth-child(7) { animation-duration: 18s; animation-delay: -40s; }
  .right .sticker:nth-child(8) { animation-duration: 25s; animation-delay: -12s; }
  .right .sticker:nth-child(9) { animation-duration: 32s; animation-delay: -25s; }
  .left .sticker:nth-child(1) { animation-duration: 39s; animation-delay: -38s; }
  .left .sticker:nth-child(2) { animation-duration: 21s; animation-delay: -10s; }
  .left .sticker:nth-child(3) { animation-duration: 28s; animation-delay: -23s; }
  .left .sticker:nth-child(4) { animation-duration: 35s; animation-delay: -36s; }
  .left .sticker:nth-child(5) { animation-duration: 42s; animation-delay: -8s; }
  .left .sticker:nth-child(6) { animation-duration: 24s; animation-delay: -21s; }
  .left .sticker:nth-child(7) { animation-duration: 31s; animation-delay: -34s; }
  .left .sticker:nth-child(8) { animation-duration: 38s; animation-delay: -6s; }
  .left .sticker:nth-child(9) { animation-duration: 20s; animation-delay: -19s; }
  .top .sticker:nth-child(1) { animation-duration: 27s; animation-delay: -32s; }
  .top .sticker:nth-child(2) { animation-duration: 34s; animation-delay: -4s; }
  .top .sticker:nth-child(3) { animation-duration: 41s; animation-delay: -17s; }
  .top .sticker:nth-child(4) { animation-duration: 23s; animation-delay: -30s; }
  .top .sticker:nth-child(5) { animation-duration: 30s; animation-delay: -2s; }
  .top .sticker:nth-child(6) { animation-duration: 37s; animation-delay: -15s; }
  .top .sticker:nth-child(7) { animation-duration: 19s; animation-delay: -28s; }
  .top .sticker:nth-child(8) { animation-duration: 26s; animation-delay: -41s; }
  .top .sticker:nth-child(9) { animation-duration: 33s; animation-delay: -13s; }
  .bottom .sticker:nth-child(1) { animation-duration: 40s; animation-delay: -26s; }
  .bottom .sticker:nth-child(2) { animation-duration: 22s; animation-delay: -39s; }
  .bottom .sticker:nth-child(3) { animation-duration: 29s; animation-delay: -11s; }
  .bottom .sticker:nth-child(4) { animation-duration: 36s; animation-delay: -24s; }
  .bottom .sticker:nth-child(5) { animation-duration: 18s; animation-delay: -37s; }
  .bottom .sticker:nth-child(6) { animation-duration: 25s; animation-delay: -9s; }
  .bottom .sticker:nth-child(7) { animation-duration: 32s; animation-delay: -22s; }
  .bottom .sticker:nth-child(8) { animation-duration: 39s; animation-delay: -35s; }
  .bottom .sticker:nth-child(9) { animation-duration: 21s; animation-delay: -7s; }

  /* Bodenschatten, atmet mit dem Schweben */
  .shadow {
    position: absolute;
    bottom: -170px;
    left: 50%;
    width: 280px;
    height: 46px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(0, 0, 0, 0.55) 0%, transparent 70%);
    filter: blur(6px);
    animation: shadowPulse 6s ease-in-out infinite;
  }

  @keyframes shadowPulse {
    0%, 100% { transform: translateX(-50%) scale(1.05); opacity: 0.9; }
    50%      { transform: translateX(-50%) scale(0.8);  opacity: 0.55; }
  }

  .title {
    position: fixed;
    bottom: 34px;
    width: 100%;
    text-align: center;
    color: #8b93b0;
    letter-spacing: 6px;
    font-size: 13px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

  <div class="scene">
    <div class="float">
      <div class="cube">
        <div class="face front">
          <div class="sticker white"></div><div class="sticker white"></div><div class="sticker white"></div>
          <div class="sticker white"></div><div class="sticker white"></div><div class="sticker white"></div>
          <div class="sticker white"></div><div class="sticker white"></div><div class="sticker white"></div>
        </div>
        <div class="face back">
          <div class="sticker yellow"></div><div class="sticker yellow"></div><div class="sticker yellow"></div>
          <div class="sticker yellow"></div><div class="sticker yellow"></div><div class="sticker yellow"></div>
          <div class="sticker yellow"></div><div class="sticker yellow"></div><div class="sticker yellow"></div>
        </div>
        <div class="face right">
          <div class="sticker red"></div><div class="sticker red"></div><div class="sticker red"></div>
          <div class="sticker red"></div><div class="sticker red"></div><div class="sticker red"></div>
          <div class="sticker red"></div><div class="sticker red"></div><div class="sticker red"></div>
        </div>
        <div class="face left">
          <div class="sticker orange"></div><div class="sticker orange"></div><div class="sticker orange"></div>
          <div class="sticker orange"></div><div class="sticker orange"></div><div class="sticker orange"></div>
          <div class="sticker orange"></div><div class="sticker orange"></div><div class="sticker orange"></div>
        </div>
        <div class="face top">
          <div class="sticker blue"></div><div class="sticker blue"></div><div class="sticker blue"></div>
          <div class="sticker blue"></div><div class="sticker blue"></div><div class="sticker blue"></div>
          <div class="sticker blue"></div><div class="sticker blue"></div><div class="sticker blue"></div>
        </div>
        <div class="face bottom">
          <div class="sticker green"></div><div class="sticker green"></div><div class="sticker green"></div>
          <div class="sticker green"></div><div class="sticker green"></div><div class="sticker green"></div>
          <div class="sticker green"></div><div class="sticker green"></div><div class="sticker green"></div>
        </div>
      </div>
    </div>
    <div class="shadow"></div>
  </div>

  <div class="title">Cubic &middot; Floating</div>

</body>
</html>
